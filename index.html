<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sprite RNG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🎰 Sprite RNG</h1>

        <div class="luck">
            🍀 Luck: <span id="luck">1.00x</span>
        </div>

        <div id="result" class="result">

            <div id="spriteContainer">
                <div id="sprite">?</div>
            </div>

            <div id="itemName">
                Roll to find something!
            </div>

            <div id="rarity">
                Your next discovery awaits...
            </div>

        </div>

        <button id="rollButton" onclick="roll()">
            ROLL
        </button>

        <div class="stats">
            Rolls: <span id="rolls">0</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
